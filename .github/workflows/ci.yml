name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # Widżet działa tylko na Windows (WPF, Win32), a hook kompiluje się do Native AOT dla win-x64.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build ClaudeWidget.slnx -c Release
      - run: dotnet test ClaudeWidget.slnx -c Release --no-build
      - name: Hook compiles with Native AOT
        run: dotnet publish src/ClaudeWidget.Hook -c Release -r win-x64 -o publish-hook
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: VS Code extension builds, passes tests and packages
        working-directory: extension
        run: |
          npm ci
          npm test
          npm run package
