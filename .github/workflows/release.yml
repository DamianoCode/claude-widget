name: release

# Wydania prowadzi release-please. Po każdym scaleniu do main aktualizuje PR „chore: wydanie X.Y.Z”
# z numerem wersji (z typów commitów: fix → poprawka, feat → nowa funkcja, feat! → nowa główna)
# i CHANGELOG-iem. Scalenie tego PR tworzy tag i wydanie, a job `build` w tym samym przebiegu
# buduje je i dokłada Setup.exe oraz paczki, z których zainstalowane widżety same się aktualizują.
# Jeden workflow, bo tag utworzony tokenem Actions nie uruchamia innych workflow.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: windows-latest
    env:
      REPO_URL: https://github.com/${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test ClaudeWidget.slnx -c Release
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: VS Code extension
        working-directory: extension
        run: |
          npm ci
          npm test
          npm run package
      - name: Publish widget and hook
        shell: pwsh
        run: |
          # Rozszerzenie VS Code jedzie w paczce; widżet instaluje je sam przy starcie.
          New-Item -ItemType Directory -Force publish | Out-Null
          Copy-Item extension/ClaudeWidgetBridge.vsix publish/
          # Widżet z własnym runtime .NET — na komputerze znajomego nie trzeba niczego doinstalowywać.
          dotnet publish src/ClaudeWidget -c Release -r win-x64 --self-contained -p:Version=$env:VERSION -o publish
          # Hook Native AOT obok widżetu: settings.json wskazuje na current\ClaudeWidgetHook.exe.
          dotnet publish src/ClaudeWidget.Hook -c Release -r win-x64 -p:Version=$env:VERSION -o publish
      - run: dotnet tool install -g vpk --version 1.2.0
      - name: Previous release for delta updates
        # Paczka przyrostowa to tylko oszczędność pobierania — bez poprzedniego wydania powstaje
        # sama pełna paczka, więc brak poprzedniego wydania nie może zablokować nowego.
        continue-on-error: true
        shell: pwsh
        run: vpk download github --repoUrl $env:REPO_URL --token $env:GH_TOKEN
      - name: Pack and upload
        shell: pwsh
        run: |
          vpk pack --packId ClaudeWidget --packVersion $env:VERSION --packDir publish --mainExe ClaudeWidget.exe --packTitle "Claude Code widget" --packAuthors DamianoCode --icon src/ClaudeWidget/Assets/widget.ico
          # Wydanie z CHANGELOG-iem już utworzył release-please; --merge dokłada do niego pliki.
          vpk upload github --repoUrl $env:REPO_URL --token $env:GH_TOKEN --publish --merge --tag $env:TAG --releaseName "Claude Code widget $env:VERSION"
